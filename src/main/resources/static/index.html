<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario hospitalario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/tema.css">
</head>
<body>

<!-- #region barra -->
<header class="barra-superior">
  <a class="marca" href="#productos" aria-label="Inventario hospitalario, ir a Productos" data-tab-enlace="productos">
    <span class="marca-logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </span>
    <span class="marca-texto"><strong>Inventario hospitalario</strong><span>Almacén y suministros</span></span>
  </a>

  <nav class="segmentado" aria-label="Secciones">
    <button type="button" data-tab="productos">Productos</button>
    <button type="button" data-tab="categorias">Categorías</button>
    <button type="button" data-tab="unidades">Unidades de medida</button>
    <button type="button" data-tab="proveedores">Proveedores</button>
    <button type="button" data-tab="auditoria" class="solo-admin" hidden>Auditoría</button>
    <a href="/usuarios" class="solo-admin" hidden>Usuarios</a>
    <a href="/roles" class="solo-admin" hidden>Roles</a>
  </nav>

  <div class="usuario-sesion">
    <div class="quien"><strong id="sesion-nombre"></strong><span id="sesion-rol"></span></div>
    <form method="post" action="/logout">
      <button type="submit" class="btn btn-secundario btn-sm salir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Cerrar sesión</span>
      </button>
    </form>
  </div>
</header>
<!-- #endregion barra -->

<main class="contenido">






</main>





<!-- Confirmación (desactivar, eliminar) -->
<dialog class="modal" id="modal-confirmar" aria-labelledby="confirmar-titulo" aria-describedby="confirmar-mensaje">
  <form method="dialog">
    <h2 id="confirmar-titulo"></h2>
    <p id="confirmar-mensaje"></p>
    <div class="modal-acciones">
      <button value="no" class="btn btn-secundario" id="confirmar-cancelar">Cancelar</button>
      <button value="si" class="btn btn-principal" id="confirmar-aceptar">Aceptar</button>
    </div>
  </form>
</dialog>

<div class="avisos" id="avisos" aria-live="polite"></div>

<script>
const API = "/api";
const $ = id => document.getElementById(id);

const ICONOS = {
  editar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  exito: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5V8"/></svg>'
};

// ---------- API ----------
async function apiFetch(path, options) {
  const res = await fetch(API + path, options);
  if (res.status === 401) {
    window.location.href = "/login";
    throw new Error("Tu sesión expiró");
  }
  let body = null;
  const text = await res.text();
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = text; }
  if (!res.ok) {
    const err = new Error((body && (body.message || body.error)) || `Error HTTP ${res.status}`);
    err.status = res.status;
    err.errores = body && body.errores;   // detalle por campo de los errores de validación
    throw err;
  }
  return body;
}

function enviarJson(path, method, datos) {
  return apiFetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos)
  });
}

// ---------- utilidades ----------
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function normalizar(texto) {
  return String(texto || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}

function conRetraso(fn, ms = 250) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function contar(n, singular, plural) {
  return `${n} ${n === 1 ? singular : plural}`;
}

// "15 productos" sin filtros; "3 resultados" con filtros
function textoContador(n, filtrado, singular, plural) {
  return filtrado ? contar(n, "resultado", "resultados") : contar(n, singular, plural);
}

function valorTexto(id) {
  const v = $(id).value.trim();
  return v === "" ? null : v;
}

function valorNumero(id) {
  const v = $(id).value;
  return v === "" ? null : Number(v);
}

// ---------- avisos ----------
function avisar(mensaje, tipo = "info") {
  const el = document.createElement("div");
  el.className = `toast ${tipo}`;
  if (tipo === "error") el.setAttribute("role", "alert");
  el.innerHTML = `<span class="toast-icono">${ICONOS[tipo] || ICONOS.info}</span><span></span>`;
  el.lastElementChild.textContent = mensaje;
  $("avisos").appendChild(el);
  setTimeout(() => el.remove(), tipo === "error" ? 6000 : 3500);
}

// ---------- confirmación ----------
function confirmar({ titulo, mensaje, aceptar = "Aceptar", peligro = false }) {
  const dialogo = $("modal-confirmar");
  $("confirmar-titulo").textContent = titulo;
  $("confirmar-mensaje").textContent = mensaje;
  const btn = $("confirmar-aceptar");
  btn.textContent = aceptar;
  btn.className = "btn " + (peligro ? "btn-peligro" : "btn-principal");
  return new Promise(resolve => {
    dialogo.returnValue = "";
    dialogo.addEventListener("close", () => resolve(dialogo.returnValue === "si"), { once: true });
    dialogo.showModal();
    $("confirmar-cancelar").focus();
  });
}

// ---------- panel lateral ----------
// Es un <dialog> modal: atrapa el foco, Esc lo cierra y al cerrarse devuelve el foco al botón que lo abrió.
const menosMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)");

function abrirPanel(panel) {
  panel.classList.remove("cerrando");
  panel.showModal();
  const primero = panel.querySelector(".panel-cuerpo input:not([type=hidden]), .panel-cuerpo select, .panel-cuerpo textarea");
  if (primero) primero.focus();
}

function cerrarPanel(panel) {
  if (!panel.open || panel.classList.contains("cerrando")) return;
  if (menosMovimiento.matches) { panel.close(); return; }
  let listo = false;
  const terminar = () => {
    if (listo) return;
    listo = true;
    panel.classList.remove("cerrando");
    panel.close();
  };
  panel.classList.add("cerrando");
  panel.addEventListener("animationend", terminar, { once: true });
  setTimeout(terminar, 300);
}

document.querySelectorAll("dialog.panel-lateral").forEach(panel => {
  panel.addEventListener("cancel", e => { e.preventDefault(); cerrarPanel(panel); });
  panel.querySelectorAll("[data-cerrar-panel]").forEach(b => b.addEventListener("click", () => cerrarPanel(panel)));
});

// ---------- validación de formularios ----------
// Mismas reglas que antes (required, maxlength, min) pero con el error debajo de cada campo.
function prepararCampos(form) {
  form.querySelectorAll(".campo").forEach(campo => {
    const control = campo.querySelector("input, select, textarea");
    if (!control || campo.querySelector(".error-campo")) return;
    const error = document.createElement("div");
    error.className = "error-campo";
    error.id = control.id + "-error";
    error.hidden = true;
    campo.appendChild(error);
    control.setAttribute("aria-describedby", error.id);
    const limpiar = () => { if (control.getAttribute("aria-invalid")) marcarError(control, ""); };
    control.addEventListener("input", limpiar);
    control.addEventListener("change", limpiar);
  });
}

function marcarError(control, mensaje) {
  const error = $(control.id + "-error");
  if (mensaje) control.setAttribute("aria-invalid", "true");
  else control.removeAttribute("aria-invalid");
  if (error) { error.textContent = mensaje; error.hidden = !mensaje; }
}

function mensajeValidacion(control) {
  const v = control.validity;
  if (v.valueMissing) return "Este campo es obligatorio.";
  if (v.typeMismatch) return control.type === "email" ? "Ingresa un correo válido, por ejemplo nombre@dominio.com." : "El formato no es válido.";
  if (v.badInput) return "Ingresa un número válido.";
  if (v.rangeUnderflow) return `Debe ser mayor o igual a ${control.min}.`;
  if (v.stepMismatch) return "Ingresa un número entero.";
  if (v.tooLong) return `Máximo ${control.maxLength} caracteres.`;
  return control.validationMessage;
}

function alertaDe(form) {
  return form.querySelector(".alerta.error");
}

function limpiarErrores(form) {
  form.querySelectorAll("[aria-invalid]").forEach(c => marcarError(c, ""));
  const alerta = alertaDe(form);
  if (alerta) { alerta.hidden = true; alerta.textContent = ""; }
}

function validarFormulario(form) {
  limpiarErrores(form);
  let primero = null;
  form.querySelectorAll(".campo input, .campo select, .campo textarea").forEach(control => {
    if (control.checkValidity()) return;
    marcarError(control, mensajeValidacion(control));
    primero = primero || control;
  });
  if (primero) primero.focus();
  return !primero;
}

// Errores de la API: los de validación van debajo de su campo; los de negocio (stock incoherente,
// código duplicado, etc.) en la alerta de arriba del formulario.
function mostrarErrorApi(form, err, campos) {
  const alerta = alertaDe(form);
  let primero = null;
  const sinCampo = [];
  Object.entries(err.errores || {}).forEach(([clave, mensaje]) => {
    const control = $(campos[clave.split(".")[0]] || "");
    if (control) {
      marcarError(control, mensaje);
      primero = primero || control;
    } else {
      sinCampo.push(mensaje);
    }
  });
  const textoAlerta = primero
    ? ["Revisa los campos marcados.", ...sinCampo].join(" ")
    : [err.message, ...sinCampo].join(": ");
  alerta.textContent = textoAlerta;
  alerta.hidden = false;
  (primero || alerta).focus();
  if (!primero) alerta.scrollIntoView({ block: "nearest" });
}

// ---------- estados de las tablas ----------
function filasEsqueleto(tbody, columnas, filas = 5) {
  tbody.closest("table").setAttribute("aria-busy", "true");
  const fila = `<tr class="esqueleto" aria-hidden="true">${
    Array.from({ length: columnas }, (_, i) =>
      `<td><span style="width:${55 + (i * 17) % 40}%"></span>${i === 0 ? '<span class="corto"></span>' : ""}</td>`
    ).join("")}</tr>`;
  tbody.innerHTML = fila.repeat(filas);
}

function filaVacia(tbody, columnas, titulo, texto, botonHtml = "") {
  tbody.closest("table").removeAttribute("aria-busy");
  tbody.innerHTML = `<tr class="vacio"><td colspan="${columnas}"><div class="vacio-contenido">
    <strong>${esc(titulo)}</strong><span>${esc(texto)}</span>${botonHtml ? `<div>${botonHtml}</div>` : ""}
  </div></td></tr>`;
}

function errorDeCarga(tbody, columnas, err, que) {
  if (err.status === 403) {
    filaVacia(tbody, columnas, "Sin acceso", `Tu rol no tiene permiso para consultar ${que}.`);
  } else {
    filaVacia(tbody, columnas, `No se pudieron cargar ${que}`, err.message);
  }
}

const BOTON_LIMPIAR = '<button type="button" class="btn btn-secundario btn-sm" data-accion="limpiar">Limpiar filtros</button>';

function etiquetaEstado(activo, femenino) {
  const texto = activo ? (femenino ? "Activa" : "Activo") : (femenino ? "Inactiva" : "Inactivo");
  return `<span class="etiqueta ${activo ? "activo" : "inactivo"}">${texto}</span>`;
}

function botonEditar(id, nombre) {
  return `<button type="button" class="btn-icono" data-accion="editar" data-id="${Number(id)}"
    aria-label="Editar ${esc(nombre)}" data-tooltip="Editar">${ICONOS.editar}</button>`;
}

function interruptorEstado(id, activo, nombre) {
  return `<button type="button" class="interruptor" role="switch" aria-checked="${activo ? "true" : "false"}"
    data-accion="estado" data-id="${Number(id)}" aria-label="Activo: ${esc(nombre)}"
    data-tooltip="${activo ? "Desactivar" : "Activar"}"><span class="pista"></span></button>`;
}

// Tras recargar una tabla, devuelve el foco al interruptor que se acaba de usar
function enfocarInterruptor(tbodyId, id) {
  const btn = document.querySelector(`#${tbodyId} [data-accion="estado"][data-id="${Number(id)}"]`);
  if (btn) btn.focus();
}

// ---------- sesión ----------
let sesion = null;
const NOMBRES_ROL = { ADMINISTRADOR: "Administrador", MEDICO: "Médico", RECEPCIONISTA: "Recepcionista" };

function esAdmin() {
  return !!sesion && sesion.rol === "ADMINISTRADOR";
}

function nombreRol(rol) {
  if (!rol) return "";
  return NOMBRES_ROL[rol] || rol.charAt(0) + rol.slice(1).toLowerCase();
}

async function cargarSesion() {
  sesion = await apiFetch("/sesion");
  $("sesion-nombre").textContent = sesion.nombre || sesion.username;
  $("sesion-rol").textContent = `${sesion.username} · ${nombreRol(sesion.rol)}`;
  document.querySelectorAll(".solo-admin").forEach(el => { el.hidden = !esAdmin(); });
}

// ---------- módulos y pestañas ----------
// Cada pestaña se registra con: preparar() al iniciar, cargar() después de la sesión,
// catalogoActualizado() cuando cambian categorías/unidades/proveedores y alMostrar() al abrirla.
const modulos = [];
function registrarModulo(modulo) { modulos.push(modulo); }

function mostrarTab(nombre) {
  let boton = document.querySelector(`.segmentado [data-tab="${nombre}"]`);
  if (!boton || boton.hidden) {
    nombre = "productos";
    boton = document.querySelector('.segmentado [data-tab="productos"]');
  }
  document.querySelectorAll(".segmentado [data-tab]").forEach(b => {
    if (b === boton) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  boton.scrollIntoView({ block: "nearest", inline: "nearest" });
  document.querySelectorAll("main .tab").forEach(s => { s.hidden = s.id !== nombre; });
  if (location.hash !== "#" + nombre) history.replaceState(null, "", "#" + nombre);
  const modulo = modulos.find(m => m.tab === nombre);
  if (modulo && modulo.alMostrar) modulo.alMostrar();
}

document.querySelectorAll(".segmentado [data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    mostrarTab(btn.dataset.tab);
    window.scrollTo({ top: 0 });
  });
});
document.querySelectorAll("[data-tab-enlace]").forEach(a => {
  a.addEventListener("click", e => { e.preventDefault(); mostrarTab(a.dataset.tabEnlace); });
});
window.addEventListener("hashchange", () => mostrarTab(location.hash.slice(1)));

// ---------- catálogo compartido ----------
// Categorías, unidades y proveedores: los usan sus pestañas y los selects de productos.
const catalogo = { categorias: [], unidades: [], proveedores: [], errores: {} };

async function cargarCatalogo() {
  const fuentes = { categorias: "/categorias", unidades: "/unidades-medida", proveedores: "/proveedores" };
  await Promise.all(Object.entries(fuentes).map(async ([clave, ruta]) => {
    try {
      catalogo[clave] = await apiFetch(ruta);
      delete catalogo.errores[clave];
    } catch (err) {
      catalogo[clave] = [];
      catalogo.errores[clave] = err;
    }
  }));
  modulos.forEach(m => m.catalogoActualizado && m.catalogoActualizado());
}






// ---------- inicio ----------
(async function init() {
  try {
    await cargarSesion();
  } catch (err) {
    avisar(err.message, "error");
    return;
  }
  modulos.forEach(m => m.preparar && m.preparar());
  mostrarTab(location.hash.slice(1) || "productos");
  await cargarCatalogo();
  modulos.forEach(m => m.cargar && m.cargar());
})();
</script>

</body>
</html>
