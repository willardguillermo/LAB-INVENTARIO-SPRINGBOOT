<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h2>Roles</h2>
    <a th:href="@{/roles/nuevo}" class="btn btn-primary mb-3">Nuevo Rol</a>
    <table class="table table-bordered">
        <thead>
        <tr><th>Nombre</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="rol : ${roles}">
            <td th:text="${rol.nombre}"></td>
            <td th:text="${rol.estado} ? 'Activo' : 'Inactivo'"></td>
            <td>
                <a th:href="@{/roles/editar/{id}(id=${rol.id})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/roles/estado/{id}(id=${rol.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-secondary">Activar/Desactivar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
