<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<!-- BARRA DE NAVEGACIÓN CON MENÚ POR ROL -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded">
    <div class="container-fluid">
        <a class="navbar-brand ms-2" href="#">Inventario</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Opciones visibles solo para ADMINISTRADOR -->
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link active" th:href="@{/roles}">Roles</a>
                </li>

                <!-- Opciones visibles para ADMINISTRADOR y MEDICO -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')">
                    <a class="nav-link" th:href="@{/}">Productos</a>
                </li>

            </ul>

            <!-- Usuario Logueado + Botón Salir -->
            <div class="d-flex text-white align-items-center me-2" sec:authorize="isAuthenticated()">
                <span class="me-3">Usuario: <strong sec:authentication="name">admin</strong></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                </form>
            </div>

        </div>
    </div>
</nav>

<div class="container">
    <h2>Roles</h2>

    <!-- Botón visible solo para ADMINISTRADOR -->
    <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/roles/nuevo}" class="btn btn-primary mb-3">Nuevo Rol</a>

    <table class="table table-bordered">
        <thead>
        <tr><th>Nombre</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="rol : ${roles}">
            <td th:text="${rol.nombre}"></td>
            <td th:text="${rol.estado} ? 'Activo' : 'Inactivo'"></td>
            <td>
                <a th:href="@{/roles/editar/{id}(id=${rol.id})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/roles/estado/{id}(id=${rol.id})}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-sm btn-secondary">Activar/Desactivar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
