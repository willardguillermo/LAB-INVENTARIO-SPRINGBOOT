<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Rol</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
  <h2 th:text="${rol.id} != null ? 'Editar Rol' : 'Nuevo Rol'"></h2>
  <form th:action="${rol.id} != null ? @{/roles/editar/{id}(id=${rol.id})} : @{/roles}" method="post">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" name="nombre" th:value="${rol.nombre}" required>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a th:href="@{/roles}" class="btn btn-link">Cancelar</a>
  </form>
</div>
</body>
</html>
