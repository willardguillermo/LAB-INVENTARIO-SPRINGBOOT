<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios · Inventario Hospitalario</title>
    <th:block th:replace="~{fragments/layout :: estilos}"></th:block>
</head>
<body>

<th:block th:replace="~{fragments/layout :: barra('usuarios')}"></th:block>

<main class="app-main">
    <div class="page-header">
        <div>
            <h1 class="page-title">Usuarios</h1>
            <p class="page-description">Cuentas con acceso al sistema y el rol que determina sus permisos.</p>
        </div>
        <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/usuarios/nuevo}" class="btn btn-primary">
            <span data-icon="mas"></span>Nuevo usuario
        </a>
    </div>

    <div th:if="${error}" class="alert alert-error" role="alert">
        <span data-icon="error"></span><span th:text="${error}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <div>
                <h2 class="card-title">Listado de usuarios</h2>
                <p class="card-subtitle" th:text="${#lists.size(usuarios)} + (${#lists.size(usuarios)} == 1 ? ' usuario registrado' : ' usuarios registrados')"></p>
            </div>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th class="col-acciones">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}" class="state-row">
                    <td colspan="5">
                        <div class="state">
                            <div class="state-icon"><span data-icon="vacio"></span></div>
                            <div class="state-title">Aún no hay usuarios</div>
                            <div class="state-text">Crea el primero con el botón «Nuevo usuario».</div>
                        </div>
                    </td>
                </tr>
                <tr th:each="usuario : ${usuarios}" th:classappend="${usuario.estado} ? '' : 'is-inactive'">
                    <td class="col-min"><span class="cell-title" th:text="${usuario.nombre}"></span></td>
                    <td th:text="${usuario.username}"></td>
                    <td>
                        <span th:if="${usuario.rol != null}" class="tag" th:text="${usuario.rol.nombre}"></span>
                        <span th:if="${usuario.rol == null}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span class="badge badge-dot" th:classappend="${usuario.estado} ? 'badge-success' : 'badge-neutral'"
                              th:text="${usuario.estado} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td class="col-acciones">
                        <div class="row-actions">
                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline" title="Editar" aria-label="Editar">
                                <span data-icon="editar"></span><span class="btn-label">Editar</span>
                            </a>
                            <form th:action="@{/usuarios/estado/{id}(id=${usuario.id})}" method="post"
                                  th:attr="data-confirmar=${usuario.estado} ? |El usuario «${usuario.username}» no podrá iniciar sesión hasta que lo actives de nuevo.| : null"
                                  data-confirmar-titulo="¿Desactivar usuario?" data-confirmar-boton="Desactivar">
                                <button type="submit" class="btn btn-sm btn-estado"
                                        th:classappend="${usuario.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        th:title="${usuario.estado} ? 'Desactivar' : 'Activar'" th:attr="aria-label=${usuario.estado} ? 'Desactivar' : 'Activar'">
                                    <span data-icon="power"></span><span class="btn-label" th:text="${usuario.estado} ? 'Desactivar' : 'Activar'"></span>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
