<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.id} != null ? 'Editar usuario' : 'Nuevo usuario'">Formulario de Usuario</title>
    <th:block th:replace="~{fragments/layout :: estilos}"></th:block>
</head>
<body>

<th:block th:replace="~{fragments/layout :: barra('usuarios')}"></th:block>

<main>
    <div class="card">
        <h2 th:text="${usuario.id} != null ? 'Editar usuario' : 'Registrar usuario'">Formulario</h2>

        <div th:if="${error}" class="alerta error" th:text="${error}"></div>

        <form th:action="${usuario.id} != null ? @{/usuarios/editar/{id}(id=${usuario.id})} : @{/usuarios}"
              method="post" th:object="${usuario}" class="grid">

            <div>
                <label>Nombre *</label>
                <input type="text" th:field="*{nombre}" required maxlength="100">
                <div class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div>
                <label>Usuario *</label>
                <input type="text" th:field="*{username}" required maxlength="100">
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div>
                <label th:text="${usuario.id} != null ? 'Contraseña' : 'Contraseña *'">Contraseña</label>
                <!-- Sin th:value a propósito: nunca se precarga el hash guardado en el campo. -->
                <input type="password" name="password" th:required="${usuario.id == null}"
                       placeholder="••••••••" maxlength="255" autocomplete="new-password">
                <p class="form-hint" th:if="${usuario.id != null}">Deja vacío para mantener la contraseña actual.</p>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div>
                <label>Rol *</label>
                <select name="rolId" required>
                    <option value="">— Selecciona —</option>
                    <option th:each="rol : ${roles}"
                            th:value="${rol.id}"
                            th:text="${rol.nombre}"
                            th:selected="${usuario.rol != null and usuario.rol.id == rol.id}">
                    </option>
                    <option th:if="${rolInactivoActual != null}"
                            th:value="${rolInactivoActual.id}"
                            th:text="${rolInactivoActual.nombre} + ' (inactivo)'"
                            selected>
                    </option>
                </select>
            </div>

            <div style="display:flex; gap:8px; align-items:center;">
                <button type="submit" class="action">Guardar</button>
                <a th:href="@{/usuarios}" class="action secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
