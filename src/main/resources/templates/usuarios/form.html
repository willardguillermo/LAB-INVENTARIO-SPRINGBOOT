<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h2 th:text="${usuario.id} != null ? 'Editar Usuario' : 'Nuevo Usuario'"></h2>
    <form th:action="${usuario.id} != null ? @{/usuarios/editar/{id}(id=${usuario.id})} : @{/usuarios}" method="post">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" th:value="${usuario.nombre}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" th:value="${usuario.username}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" th:value="${usuario.password}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-control" name="rolId" required>
                <option th:each="rol : ${roles}"
                        th:value="${rol.id}"
                        th:text="${rol.nombre}"
                        th:selected="${usuario.rol != null and usuario.rol.id == rol.id}">
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/usuarios}" class="btn btn-link">Cancelar</a>
    </form>
</div>
</body>
</html>
