<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Inventario</title>
    <th:block th:replace="~{fragments/layout :: estilos}"></th:block>
    <style>
      .login-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
        padding: 20px;
      }
      .login-card {
        width: 100%;
        max-width: 380px;
        background: var(--glass);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        border: 1px solid var(--glass-border);
        border-radius: var(--radius);
        box-shadow: 0 8px 32px rgba(15, 23, 42, 0.25);
        overflow: hidden;
      }
      .login-card .cabecera {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        text-align: center;
        padding: 22px;
      }
      .login-card .cabecera h1 { font-size: 1.2rem; margin: 0; }
      .login-card .cuerpo { padding: 24px; }
      .login-card .campo { margin-bottom: 14px; }
      .login-card button[type="submit"] { width: 100%; margin-top: 6px; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="cabecera"><h1>Inventario y Almacén Hospitalario</h1></div>
        <div class="cuerpo">
            <div th:if="${param.error}" class="alerta error">
                <span th:if="${param.error[0] == 'deshabilitado'}">Tu usuario está inactivo o tu rol fue desactivado. Contacta al administrador.</span>
                <span th:unless="${param.error[0] == 'deshabilitado'}">Usuario o contraseña incorrectos.</span>
            </div>
            <div th:if="${param.logout}" class="alerta info">Has cerrado sesión correctamente.</div>
            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="Ingrese su usuario">
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
                </div>
                <button type="submit" class="action">Ingresar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
