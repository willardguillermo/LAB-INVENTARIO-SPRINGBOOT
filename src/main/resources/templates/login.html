<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Inventario Hospitalario</title>
    <th:block th:replace="~{fragments/layout :: estilos}"></th:block>
</head>
<body>
<main class="auth">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-logo"><span data-icon="logo"></span></span>
            <div>
                <h1 class="auth-title">Inventario Hospitalario</h1>
                <p class="auth-subtitle">Inicia sesión para acceder al panel</p>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-error" role="alert">
            <span data-icon="error"></span>
            <span th:if="${param.error[0] == 'deshabilitado'}">Tu usuario está inactivo o tu rol fue desactivado. Contacta al administrador.</span>
            <span th:unless="${param.error[0] == 'deshabilitado'}">Usuario o contraseña incorrectos.</span>
        </div>
        <div th:if="${param.logout}" class="alert alert-info" role="status">
            <span data-icon="info"></span>
            <span>Has cerrado sesión correctamente.</span>
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus
                       autocomplete="username" placeholder="Ingresa tu usuario">
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" required
                           autocomplete="current-password" placeholder="Ingresa tu contraseña">
                    <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar contraseña">
                        <span data-icon="ver"></span>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>

        <p class="auth-footer">Sistema de inventario y almacén hospitalario</p>
    </div>
</main>
</body>
</html>
