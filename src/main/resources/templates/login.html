<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Inventario hospitalario</title>
    <th:block th:replace="~{fragments/layout :: estilos}"></th:block>
    <style>
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .login-card { width: 100%; max-width: 400px; padding: 28px; }
      .login-card .marca { margin-bottom: 22px; }
      .login-card h1 { font-size: 1.35rem; margin-bottom: 4px; }
      .login-card .bajada { margin: 0 0 20px; color: var(--texto-suave); font-size: 0.9rem; }
      .login-card .campo { margin-bottom: 14px; }
      .login-card .btn { width: 100%; margin-top: 6px; }
    </style>
</head>
<body>
<main class="login-wrap">
    <div class="vidrio login-card">
        <div class="marca">
            <span class="marca-logo" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            <span class="marca-texto"><strong>Inventario hospitalario</strong><span>Almacén y suministros</span></span>
        </div>

        <h1>Iniciar sesión</h1>
        <p class="bajada">Ingresa con tu usuario del sistema.</p>

        <div th:if="${param.error}" class="alerta error" role="alert">
            <span th:if="${param.error[0] == 'deshabilitado'}">Tu usuario está inactivo o tu rol fue desactivado. Contacta al administrador.</span>
            <span th:unless="${param.error[0] == 'deshabilitado'}">Usuario o contraseña incorrectos.</span>
        </div>
        <div th:if="${param.logout}" class="alerta info" role="status">Cerraste sesión correctamente.</div>

        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autocomplete="username" autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-principal">Ingresar</button>
        </form>
    </div>
</main>
</body>
</html>
