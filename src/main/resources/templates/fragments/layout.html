<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<!-- Mismo tema que el panel (static/index.html): variables, fondo y componentes en /css/tema.css -->
<th:block th:fragment="estilos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" th:href="@{/css/tema.css}" href="/css/tema.css">
</th:block>
</head>
<body>

<!-- Barra superior: las pestañas del inventario llevan al panel (/#pestaña) y Usuarios/Roles a sus páginas -->
<th:block th:fragment="barra(activo)">
<header class="barra-superior">
  <a class="marca" th:href="@{/}" href="/" aria-label="Inventario hospitalario, ir a Productos">
    <span class="marca-logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </span>
    <span class="marca-texto"><strong>Inventario hospitalario</strong><span>Almacén y suministros</span></span>
  </a>

  <nav class="segmentado" aria-label="Secciones">
    <a href="/#productos">Productos</a>
    <a href="/#categorias">Categorías</a>
    <a href="/#unidades">Unidades de medida</a>
    <a href="/#proveedores">Proveedores</a>
    <a sec:authorize="hasRole('ADMINISTRADOR')" href="/#auditoria">Auditoría</a>
    <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/usuarios}"
       th:attr="aria-current=${activo == 'usuarios'} ? 'page' : null">Usuarios</a>
    <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/roles}"
       th:attr="aria-current=${activo == 'roles'} ? 'page' : null">Roles</a>
  </nav>

  <div class="usuario-sesion" sec:authorize="isAuthenticated()" th:if="${sesionUsuario != null}">
    <div class="quien">
      <strong th:text="${sesionUsuario.nombre}">Usuario</strong>
      <span th:with="rol=${sesionUsuario.rol != null} ? ${sesionUsuario.rol.nombre} : ''"
            th:text="${sesionUsuario.username} + ' · ' + (${rol == 'MEDICO'} ? 'Médico' : ${#strings.capitalize(#strings.toLowerCase(rol))})">usuario · Rol</span>
    </div>
    <form method="post" th:action="@{/logout}">
      <button type="submit" class="btn btn-secundario btn-sm salir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Cerrar sesión</span>
      </button>
    </form>
  </div>
</header>
</th:block>

<!-- Confirmación para los formularios con data-confirmar (por ejemplo, desactivar un usuario o un rol) -->
<th:block th:fragment="confirmacion">
<dialog class="modal" id="modal-confirmar" aria-labelledby="confirmar-titulo" aria-describedby="confirmar-mensaje">
  <form method="dialog">
    <h2 id="confirmar-titulo"></h2>
    <p id="confirmar-mensaje"></p>
    <div class="modal-acciones">
      <button value="no" class="btn btn-secundario" id="confirmar-cancelar">Cancelar</button>
      <button value="si" class="btn btn-principal" id="confirmar-aceptar">Aceptar</button>
    </div>
  </form>
</dialog>
<script>
  document.addEventListener("submit", function (e) {
    const form = e.target;
    if (!form.dataset.confirmar || form.dataset.confirmado) return;
    e.preventDefault();
    const dialogo = document.getElementById("modal-confirmar");
    document.getElementById("confirmar-titulo").textContent = form.dataset.confirmar;
    document.getElementById("confirmar-mensaje").textContent = form.dataset.mensaje || "";
    document.getElementById("confirmar-aceptar").textContent = form.dataset.aceptar || "Aceptar";
    dialogo.returnValue = "";
    dialogo.addEventListener("close", function () {
      if (dialogo.returnValue !== "si") return;
      form.dataset.confirmado = "true";
      form.submit();
    }, { once: true });
    dialogo.showModal();
    document.getElementById("confirmar-cancelar").focus();
  });
</script>
</th:block>

</body>
</html>
