<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<!-- Los estilos y utilidades son los mismos del panel (static/css/app.css y static/js/ui.js) -->
<th:block th:fragment="estilos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" th:href="@{/css/app.css}">
<script th:src="@{/js/ui.js}"></script>
</th:block>
</head>
<body>

<!-- Misma barra superior y pestañas que el panel; las del inventario enlazan a /#pestaña -->
<th:block th:fragment="barra(activo)">
<header class="app-header">
  <div class="topbar">
    <a class="brand" th:href="@{/}">
      <span class="brand-logo"><span data-icon="logo"></span></span>
      <span class="brand-text">
        <span class="brand-title">Inventario Hospitalario</span>
        <span class="brand-subtitle">Gestión de inventario y almacén</span>
      </span>
    </a>
    <div class="user-menu" id="sesion-bar" sec:authorize="isAuthenticated()">
      <div class="user-info" id="sesion-info">
        <span class="avatar" aria-hidden="true"
              th:text="${#strings.substring(#strings.isEmpty(sesionUsuario.nombre) ? sesionUsuario.username : sesionUsuario.nombre, 0, 1)}">A</span>
        <span class="user-text">
          <span class="user-name" th:text="${#strings.isEmpty(sesionUsuario.nombre) ? sesionUsuario.username : sesionUsuario.nombre}">Usuario</span>
          <span class="user-username" th:text="'@' + ${sesionUsuario.username}">@usuario</span>
        </span>
        <span class="badge badge-role"
              th:classappend="${sesionUsuario.rol.nombre == 'ADMINISTRADOR'} ? 'badge-info' : (${sesionUsuario.rol.nombre == 'MEDICO'} ? 'badge-success' : 'badge-warning')"
              th:text="${sesionUsuario.rol.nombre}">ROL</span>
      </div>
      <span class="user-divider"></span>
      <form method="post" th:action="@{/logout}" class="logout-form">
        <button type="submit" class="btn btn-ghost btn-sm" title="Cerrar sesión">
          <span data-icon="salir"></span><span class="logout-label">Cerrar sesión</span>
        </button>
      </form>
    </div>
  </div>
  <nav class="tabs" aria-label="Secciones del sistema">
    <a class="tab-btn" th:href="@{/#productos}"><span data-icon="productos"></span>Productos</a>
    <a class="tab-btn" th:href="@{/#categorias}"><span data-icon="categorias"></span>Categorías</a>
    <a class="tab-btn" th:href="@{/#unidades}"><span data-icon="unidades"></span>Unidades de medida</a>
    <a class="tab-btn" th:href="@{/#proveedores}"><span data-icon="proveedores"></span>Proveedores</a>
    <th:block sec:authorize="hasRole('ADMINISTRADOR')">
      <a class="tab-btn" th:href="@{/#auditoria}"><span data-icon="auditoria"></span>Auditoría</a>
      <span class="tabs-sep"></span>
      <a class="tab-btn" th:href="@{/usuarios}" th:classappend="${activo == 'usuarios'} ? 'active'"
         th:attr="aria-current=${activo == 'usuarios'} ? 'page' : null"><span data-icon="usuarios"></span>Usuarios</a>
      <a class="tab-btn" th:href="@{/roles}" th:classappend="${activo == 'roles'} ? 'active'"
         th:attr="aria-current=${activo == 'roles'} ? 'page' : null"><span data-icon="roles"></span>Roles</a>
    </th:block>
  </nav>
</header>
</th:block>

</body>
</html>
