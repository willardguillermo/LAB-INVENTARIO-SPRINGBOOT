# Configuración solo para pruebas: reemplaza a src/main/resources/application.properties
# (en el classpath de test este archivo se encuentra primero).
# H2 en memoria en modo MySQL, así las pruebas no dependen de un MySQL corriendo.
spring.application.name=lab-inventario-springboot

spring.datasource.url=jdbc:h2:mem:inventario_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
